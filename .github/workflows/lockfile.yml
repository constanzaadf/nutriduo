name: Lockfile

# Genera o actualiza pnpm-lock.yaml cuando cambian las dependencias y lo
# commitea. Así el CI y Vercel instalan siempre las mismas versiones.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "pnpm-workspace.yaml"
      - "apps/*/package.json"
      - "packages/*/package.json"
      - ".github/workflows/lockfile.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commitear si cambió
        run: |
          if [ -n "$(git status --porcelain pnpm-lock.yaml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: actualizar pnpm-lock.yaml"
            git push
          else
            echo "pnpm-lock.yaml ya estaba al día"
          fi
