name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engines-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Instala exactamente lo que dice pnpm-lock.yaml; si un package.json cambió
      # sin actualizar el lockfile, falla (el workflow "Lockfile" lo regenera).
      - run: pnpm install --frozen-lockfile
      - name: Pruebas de los motores
        run: pnpm test
      - name: Tipos de los motores
        run: pnpm typecheck
      - name: SQL del catálogo al día con sus fuentes
        run: pnpm catalog:generate && git diff --exit-code -- supabase
      - name: Tipos y build de la app
        run: pnpm --filter @nutriduo/web typecheck && pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Migraciones, integridad y RLS
        run: ./supabase/tests/run.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
